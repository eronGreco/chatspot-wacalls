name: V2 peerPhone compatibility fix

on:
  push:
    branches:
      - "v2/meowcaller"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[v2-peerphone-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2/meowcaller

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply patch
        run: |
          python3 scripts/patch_v2_peerphone.py
          gofmt -w cmd/server/httpapi.go

      - name: Test
        run: go test ./...

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/httpapi.go
          git commit -m "fix: preserve peerPhone in outbound call records"
          git push origin HEAD:v2/meowcaller
