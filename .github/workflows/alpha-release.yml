name: Alpha release

on:
  push:
    branches:
      - "v2/meowcaller"

permissions:
  contents: write

jobs:
  alpha:
    if: contains(github.event.head_commit.message, '[alpha-release]')
    runs-on: ubuntu-latest
    env:
      TAG: v2.0.0-alpha.7
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Validate server
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l cmd internal third_party)"
          go vet ./...
          go -C third_party/meowcaller vet ./...
          go test -race -count=1 ./...
          go -C third_party/meowcaller test -race -count=1 ./...

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/wacalls-server-linux-amd64 ./cmd/server
          sha256sum dist/wacalls-server-linux-amd64 > dist/wacalls-server-linux-amd64.sha256

      - name: Smoke test binary
        run: |
          test -s dist/wacalls-server-linux-amd64
          file dist/wacalls-server-linux-amd64

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Chatspot Calls v2.0.0-alpha.7
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Prepara registros de chamadas de áudio, áudio com vídeo e mistas.

            Adiciona timeline autoritativa por câmera local/remota, com relógio compartilhado com a gravação de áudio, snapshots SSE e manifesto persistente para recuperação da fila após reinício. Limite de 512 trechos e indicação explícita de histórico truncado.

            Ignora aceite tardio de upgrade após desligar a câmera local, sem afetar vídeo remoto.

            Inclui rejeição de upgrade de vídeo e aceite opcional sem câmera local, preservando áudio e a câmera remota. Mantém as correções de RTP e logs limitados da alpha.5.

            Gravação de vídeo ainda não habilitada: videoRecordingSupported=false. WAV, transcrição e resumo continuam no servidor e no fluxo atual. A interface Lovable requer atualização para exibir o novo histórico e operar upgrades durante a chamada.

            Validação obrigatória: vet e testes completos com race detector nos dois módulos. Transições WhatsApp reais ainda precisam ser confirmadas em chamada.
          files: |
            dist/wacalls-server-linux-amd64
            dist/wacalls-server-linux-amd64.sha256
