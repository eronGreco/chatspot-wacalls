name: Alpha release

on:
  push:
    branches:
      - "v2/meowcaller"

permissions:
  contents: write

jobs:
  alpha:
    if: contains(github.event.head_commit.message, '[alpha-release]')
    runs-on: ubuntu-latest
    env:
      TAG: v2.0.0-alpha.8
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Install video recording codecs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Validate server
        env:
          CGO_ENABLED: "1"
          REQUIRE_VIDEO_FFMPEG: "1"
        run: |
          test -z "$(gofmt -l cmd internal third_party)"
          go vet ./...
          go -C third_party/meowcaller vet ./...
          go test -race -count=1 ./...
          go -C third_party/meowcaller test -race -count=1 ./...

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/wacalls-server-linux-amd64 ./cmd/server
          sha256sum dist/wacalls-server-linux-amd64 > dist/wacalls-server-linux-amd64.sha256

      - name: Smoke test binary
        run: |
          test -s dist/wacalls-server-linux-amd64
          file dist/wacalls-server-linux-amd64

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Chatspot Calls v2.0.0-alpha.8
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Gravação e montagem de vídeo 1:1 exclusivamente no servidor.

            Captura H.264 comprimido dos dois participantes com timestamps, orientação e retomadas de câmera persistidos. Monta MP4 640x240, 10 fps, H.264 CRF 32 e áudio AAC mono 48 kbps, com proporção preservada e intervalos sem câmera em preto.

            Fila de vídeo independente de WAV/transcrição/resumo. Uma montagem por vez, FFmpeg com um thread por etapa, fila de captura limitada a 32 MB, proteção de disco e limites de duração/tamanho/simultaneidade. Logs sem quadros individuais.

            Envio Chatspot Type VIDEO por URL temporária, PUT binário e confirmação com fileId permanente. Originais removidos somente depois da entrega confirmada de ambos os artefatos; falhas e reinícios preservam a fila.

            Requer FFmpeg com libx264/AAC na imagem e atualização Lovable para contrato de vídeo/Registros. Use a stack alpha.8 com VIDEO_RECORDING_ENABLED=1.

            Validação: vet e testes com race detector nos dois módulos; testes FFmpeg reais de montagem, sincronização, proporção, recuperação e retenção. Chamada WhatsApp real com a nova gravação ainda precisa ser validada.
          files: |
            dist/wacalls-server-linux-amd64
            dist/wacalls-server-linux-amd64.sha256
