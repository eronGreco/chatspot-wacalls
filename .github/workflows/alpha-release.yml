name: Alpha release

on:
  push:
    branches:
      - "v2/meowcaller"

permissions:
  contents: write

jobs:
  alpha:
    if: contains(github.event.head_commit.message, '[alpha-release]')
    runs-on: ubuntu-latest
    env:
      TAG: v2.0.0-alpha.5
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Validate server
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l cmd internal third_party)"
          go vet ./...
          go -C third_party/meowcaller vet ./...
          go test -race -count=1 ./...
          go -C third_party/meowcaller test -race -count=1 ./...

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/wacalls-server-linux-amd64 ./cmd/server
          sha256sum dist/wacalls-server-linux-amd64 > dist/wacalls-server-linux-amd64.sha256

      - name: Smoke test binary
        run: |
          test -s dist/wacalls-server-linux-amd64
          file dist/wacalls-server-linux-amd64

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Chatspot Calls v2.0.0-alpha.5
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Corrige interrupções frequentes do vídeo recebido por tratar pacotes fora de ordem como perda.

            Ordena RTP autenticado por SSRC antes de montar H264, aguardando até 80ms por lacunas quando novos pacotes chegam. A fila retém no máximo 128 payloads de 1500 bytes, não cria timers ou goroutines e não acrescenta atraso ao tráfego ordenado. Perda real continua acionando a recuperação da alpha.4.

            Remove logs contínuos por pacote. Mantém amostra inicial limitada a 20 pacotes por chamada, resumos de vídeo a cada 10 segundos e resumo final com ordenações, perdas, quadros e recuperações.

            Inclui testes de reprodução dos 993 pacotes do teste autorizado, FU-A fora de ordem, perda real, duplicação, limite de memória e virada de sequência. Build, vet e testes com race detector são obrigatórios antes da publicação.

            Gravação e áudio permanecem no fluxo da alpha.4. Compatível com o Lovable já publicado; não exige nova publicação da interface.

            A fluidez precisa ser confirmada em chamada real. Benchmarks da fila não representam teste de capacidade total do servidor.
          files: |
            dist/wacalls-server-linux-amd64
            dist/wacalls-server-linux-amd64.sha256
