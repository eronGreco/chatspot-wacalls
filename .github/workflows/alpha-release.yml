name: Alpha release

on:
  push:
    branches:
      - "v2/meowcaller"

permissions:
  contents: write

jobs:
  alpha:
    if: contains(github.event.head_commit.message, '[alpha-release]')
    runs-on: ubuntu-latest
    env:
      TAG: v2.0.0-alpha.4
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Validate server
        env:
          CGO_ENABLED: "1"
        run: |
          test -z "$(gofmt -l cmd internal third_party)"
          go vet ./...
          go -C third_party/meowcaller vet ./...
          go test -race -count=1 ./...
          go -C third_party/meowcaller test -race -count=1 ./...

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/wacalls-server-linux-amd64 ./cmd/server
          sha256sum dist/wacalls-server-linux-amd64 > dist/wacalls-server-linux-amd64.sha256

      - name: Smoke test binary
        run: |
          test -s dist/wacalls-server-linux-amd64
          file dist/wacalls-server-linux-amd64

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Chatspot Calls v2.0.0-alpha.4
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Corrige a recuperação do vídeo recebido do celular em chamadas 1:1.

            O navegador pode solicitar um novo quadro completo através do servidor. O servidor envia PLI/SRTCP autenticado e repete com intervalo controlado até receber IDR, preservando SPS/PPS necessários ao decoder. Os timers encerram junto com a mídia.

            Meowcaller permanece baseado no pin c48c3e2a243c672c942cbf0c941d14161720d540, com fonte MIT local e alterações específicas de recuperação. Não altera codecs de áudio ou sinalização da chamada.

            Inclui a preservação das gravações até confirmação de entrega da alpha.3. A gravação de vídeo ainda não foi implementada.

            Publicar também o Lovable atualizado: receptor com recuperação, tela compacta com mute e transcrição por trechos com tempo original.

            Validado por build, vet, testes de bridge, H264, SRTCP e concorrência. Nova chamada real ainda é necessária.
          files: |
            dist/wacalls-server-linux-amd64
            dist/wacalls-server-linux-amd64.sha256
